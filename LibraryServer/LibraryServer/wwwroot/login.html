<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Secret Shelf Library</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="link_logo.png">
    <style>
        /* Додаємо стилі для форми */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            margin-bottom: 5px;
        }
        input {
            padding: 8px;
            font-size: 1em;
        }
        button {
            padding: 10px;
            background-color: #004d4d;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #007373;
        }
        /* Стилі для модального вікна */
        .modal {
            display: none; /* Сховати модал за замовчуванням */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0); /* Чорний фон з прозорістю */
            background-color: rgba(0,0,0,0.4); /* Зробити фон напівпрозорим */
            padding-top: 60px;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Можна задати ширину */
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="logo.png" alt="Library Logo">
                <span>Secret Shelf Library</span>
            </div>
            <div class="user-actions">
                <a href="login.html">Вхід</a> | <a href="register.html">Реєстрація</a>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="books.html">Перегляд книг</a></li>
                <li><a href="account.html">Мій кабінет</a></li>
                <li><a href="services.html">Сервіси</a></li>
                <li><a href="news.html">Новини</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="main-content">
            <h1>Вхід</h1>
            <form action="/login" method="POST">
                <label for="username">Ім'я користувача:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Увійти</button>
            </form>
        </div>
    </main>
    <footer>
        <p>Всі права захищено © 2013 - 2024 Secret Shelf Library</p>
        <div class="footer-contact">
            <a href="#">Контакти</a> | <a href="#">Соцмережі</a>
        </div>
    </footer>

    <!-- Модальне вікно для повідомлень -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="notification" style="color: red;"></p>
        </div>
    </div>

    <script>
        document.querySelector("form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const response = await fetch("/login", {
                method: "POST",
                body: formData
            });

            const data = await response.json(); // Отримати JSON-дані з відповіді

            const modal = document.getElementById("myModal");
            const notification = document.getElementById("notification");
            notification.textContent = data.message; // Виводимо повідомлення
            
            if (data.success) {
                window.location.href = "/account.html"; // Перейти на сторінку аккаунта
                localStorage.setItem("nickname", data.nickname);
            } else {
                modal.style.display = "block"; // Показуємо модальне вікно
            }
        });

        // Закриття модального вікна
        const closeModal = document.getElementsByClassName("close")[0];
        closeModal.onclick = function() {
            document.getElementById("myModal").style.display = "none";
        }
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
